name: Instagram feed

# Rebuilds assets/homepage/instagram/feed.json from the real @wooldridgeboats
# account. Runs on a schedule and can be run by hand from the Actions tab.
# Turns on automatically once the IG_TOKEN repo secret exists; until then every
# run just stops after the guard step and the website keeps showing the baked-in
# photos. Full explanation: _build/instagram/INSTAGRAM-FEED-SETUP.md

on:
  schedule:
    # Once a day (Tyler, 2026-10-08: "We don't update our instagram that much"). 10:23 UTC =
    # 3:23 AM PDT, but GitHub often starts it hours late; since the feed moved to its own repo
    # (2026-10-20) the timing no longer matters: nothing here triggers a site deploy. Daily is plenty
    # for the token renewal below (the token lasts ~60 days). After posting, use the Actions tab's
    # "Run workflow" button to update the homepage right away.
    - cron: '23 10 * * *'
  workflow_dispatch:            # a "Run workflow" button in the Actions tab

# READ-ONLY on the website repo, on purpose (Tyler 2026-10-20, option A): the robot
# must never commit here. Every push to this repo's main redeploys the whole site
# (~646 MB, ~1.5 min) and GitHub runs this "3 AM" schedule hours late (6:47-10 AM
# Pacific in Oct 2026), so its commits kept landing next to Tyler's pushes. The
# feed now lives in its own repo, WooldridgeBoats/instagram-feed, written with
# GH_PAT (that token needs Contents: Read and write on instagram-feed).
permissions:
  contents: read

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # Gate everything below on whether the token exists, via a step OUTPUT
      # (referencing secrets directly inside an `if:` is avoided on purpose).
      - name: Is the Instagram token set?
        id: guard
        run: |
          if [ -n "$IG_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No IG_TOKEN secret yet — nothing to do. This is expected before setup."
          fi

      - name: Renew the token (extends it ~60 days; persists it if GH_PAT is set)
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | jq -r '.access_token // empty')
          if [ -n "$NEW" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
            echo "Token renewed and saved back to the IG_TOKEN secret."
          elif [ -n "$NEW" ]; then
            echo "Token renewed for this run. Add a GH_PAT secret to make renewals permanent."
          else
            echo "Could not renew (token may still be valid). Continuing."
          fi

      - name: Check out the feed repo (where the posts are saved)
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: WooldridgeBoats/instagram-feed
          token: ${{ secrets.GH_PAT }}
          path: feed

      - name: Build feed.json from the latest posts
        if: steps.guard.outputs.ready == 'true'
        env:
          FEED_REPO: WooldridgeBoats/instagram-feed
          FEED_BRANCH: main
          OUT_DIR: feed
          FEED_PATH: ''
        run: node _build/instagram/fetch_feed.mjs

      - name: Commit to the feed repo only if the feed actually changed
        if: steps.guard.outputs.ready == 'true'
        id: commit
        working-directory: feed
        run: |
          git config user.name  "wooldridge-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json img-*.jpg
          if git diff --cached --quiet; then
            echo "No new posts — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(instagram): refresh homepage feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the jsDelivr CDN copy so the site sees it right away
        if: steps.commit.outputs.changed == 'true'
        run: |
          base="https://purge.jsdelivr.net/gh/WooldridgeBoats/instagram-feed@main"
          curl -s "$base/feed.json" > /dev/null || true
          for i in 1 2 3 4 5 6 7 8; do curl -s "$base/img-$i.jpg" > /dev/null || true; done
          echo "Asked jsDelivr to fetch the new feed."
